<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmileTrack - SMILING DENTAL</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-caja">
      <h1>SMILING DENTAL</h1>
      <p class="subtitulo">SmileTrack &mdash; Gestion de citas y soporte</p>

      <form id="formLogin">
        <label for="email">Correo</label>
        <input type="email" id="email" required placeholder="tucorreo@smilingdental.com" />
        <div class="error-campo" id="errorEmail"></div>

        <label for="password">Contrasena</label>
        <input type="password" id="password" required placeholder="********" />
        <div class="error-campo" id="errorPassword"></div>

        <button type="submit" class="btn-primario" style="width:100%">Ingresar</button>
        <div id="mensajeGeneral"></div>
      </form>

      <p style="font-size:0.8rem;color:#64748B;margin-top:20px;">
        ¿Solo tienes una pregunta? <a href="/chatbot.html">Habla con nuestro asistente</a>, sin necesidad de iniciar sesion.
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
